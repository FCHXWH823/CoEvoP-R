# DREAMPlace 4.0 timing-driven Tier-2 panel.
#
# This panel uses a repo-tracked ChipBench bp_fe OpenTimer config:
#   timing_opt_flag = 1
#   verilog_input, sdc_input, and lib_input are present
#
# It is intentionally bp_fe-only because bp_fe is currently the verified
# ChipBench design with timing collateral in this local DREAMPlace install.
# The upstream mixed timing config referenced a missing pre_place.def; this
# config uses the installed macro_placed.def and the license-free OpenTimer path.

seeds = [1000]
iterations = 50
gpu = 1
timeout_seconds = 2400
log_interval = 10
timing_mode = "claim"

[[designs]]
name = "bp_fe_timing_driven"
dreamplace_config = "../dreamplace_base/bp_fe_timing_opentimer_macroplaced.json"
chipbench_config = "${HOME}/ChiPBench/flow/designs/nangate45/bp_fe_top/config.mk"
reference_def = "${HOME}/ChiPBench/bp_fe_placed.def"
mode = "global"
timing_mode = "claim"
