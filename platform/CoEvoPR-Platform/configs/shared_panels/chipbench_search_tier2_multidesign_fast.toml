# Fast multi-design DREAMPlace search panel for direct Tier-2 OpenEvolve validation.
#
# This is cheaper than chipbench_search_tier2_multidesign.toml:
# - one seed instead of two,
# - shorter DREAMPlace placement,
# - same three-design family coverage.
#
# Use this panel to verify prompt/gate/evolution behavior before launching the
# official longer direct Tier-2 run.

seeds = [1000]
iterations = 20
gpu = 1
timeout_seconds = 1800
log_interval = 10
timing_mode = "none"

[[designs]]
name = "bp_fe"
dreamplace_config = "${HOME}/DREAMPlace/install/benchmarks/chipbench/bp_fe/bp_fe.json"
chipbench_config = "${HOME}/ChiPBench/flow/designs/nangate45/bp_fe_top/config.mk"
reference_def = "${HOME}/ChiPBench/bp_fe_placed.def"
mode = "global"
timing_mode = "none"

[[designs]]
name = "ethernet"
dreamplace_config = "${HOME}/DREAMPlace/install/benchmarks/chipbench/ethernet/cfg_000.json"
chipbench_config = "${HOME}/ChiPBench/flow/designs/nangate45/ethernet/config.mk"
mode = "global"
timing_mode = "none"

[[designs]]
name = "isa_npu"
dreamplace_config = "${HOME}/DREAMPlace/install/benchmarks/chipbench/isa_npu/train_cfg_1446_mixed.json"
chipbench_config = "${HOME}/ChiPBench/flow/designs/nangate45/isa_npu/config.mk"
mode = "global"
timing_mode = "none"
