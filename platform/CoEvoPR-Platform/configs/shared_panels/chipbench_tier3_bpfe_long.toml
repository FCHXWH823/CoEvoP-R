# Long-timeout OpenROAD/ChiPBench Tier-3 validation panel for selected bp_fe
# finalists. Use this only for a tiny selected set, not inside evolution.

seeds = [1000]
iterations = 50
gpu = 1
timeout_seconds = 7200
log_interval = 10
timing_mode = "none"

[[designs]]
name = "bp_fe"
dreamplace_config = "${HOME}/DREAMPlace/install/benchmarks/chipbench/bp_fe/bp_fe.json"
chipbench_config = "${HOME}/ChiPBench/flow/designs/nangate45/bp_fe_top/config.mk"
reference_def = "${HOME}/ChiPBench/bp_fe_placed.def"
mode = "global"
timing_mode = "none"
