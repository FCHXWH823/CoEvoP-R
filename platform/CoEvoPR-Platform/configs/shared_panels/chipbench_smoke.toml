# Shared DREAMPlace/OpenROAD-compatible validation panel.
# This panel is the main end-to-end evidence path; ISPD2005 remains only a
# DREAMPlace optimizer smoke panel.

seeds = [1000]
iterations = 50
gpu = 1
timeout_seconds = 2400
log_interval = 10
timing_mode = "none"

[[designs]]
name = "bp_fe"
dreamplace_config = "${HOME}/DREAMPlace/install/benchmarks/chipbench/bp_fe/bp_fe.json"
chipbench_config = "${HOME}/ChiPBench/flow/designs/nangate45/bp_fe_top/config.mk"
reference_def = "${HOME}/ChiPBench/bp_fe_placed.def"
mode = "global"
timing_mode = "none"
