# Focused Tier-2-only GPT run for native-residual objective discovery.
# This uses one ChiPBench design panel to test whether the richer environment
# can beat native DREAMPlace without falling back to fixed density-weight tuning.

provider = "openai"
term_scope = "dreamplace_replacement"
objective_mode = "native_residual"
mutation_mode = "diff"
max_iterations = 6
population_size = 40
archive_size = 10
num_islands = 3
checkpoint_interval = 3
num_top_programs = 3
num_diverse_programs = 1
severe_regression_pct = 10.0
seed = 78
evaluate_initial_presets = true
primary_baseline = "default"
hpwl_gate_search_pct = 0.0
hpwl_gate_elite_pct = 0.0
per_design_hpwl_gate_search_pct = 0.0
per_design_overflow_gate_search_pct = 0.0
min_design_both_improvement_fraction = 1.0
overflow_severe_regression_pct = 10.0
require_nonzero_routing_term = true
min_abs_routing_coeff = 0.000000001
route_coeff_cap = 0.03
route_coeff_grid = [-0.03, -0.01, -0.003, -0.001, 0.001, 0.003, 0.01, 0.03]
density_coeff_grid = [1.0]
wirelength_coeff_grid = [1.0]
max_calibrated_siblings = 0
max_generation_attempts = 4
parent_policy = "hpwl_safe_only"
structured_feedback = true
router_background = "../../prompts/router_objective_background.md"

initial_presets = [
  "dreamplace_native_default",
  "dreamplace_native_soft_rudy_mean",
  "dreamplace_native_soft_rudy_pnorm",
  "dreamplace_density_135",
]

[search]
panel = "../shared_panels/chipbench_search_tier2.toml"
baseline_presets = [
  "dreamplace_native_default",
  "dreamplace_native_soft_rudy_mean",
  "dreamplace_native_soft_rudy_pnorm",
  "dreamplace_density_135",
]

[final]
enabled = false

[tier3]
enabled = false

[feedback]
# Optional local feedback file from a previous run. Keep disabled in committed
# configs because runs/ is intentionally not versioned.
prior_feedback = ""
