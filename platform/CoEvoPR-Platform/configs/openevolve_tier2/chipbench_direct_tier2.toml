# Primary CoEvoP&R direct-evolution config.
#
# This is the main methodology path after dropping CircuitNet from the core
# optimization loop:
#
#   LLM objective_program
#   -> restricted ObjectiveSpec validation
#   -> batched DREAMPlace placement on the ChiPBench/Nangate45 search panel
#   -> HPWL/overflow/runtime/gradient feedback
#   -> OpenEvolve-style local memory
#   -> selected-finalist OpenROAD routing only when enabled
#
# CircuitNet is not used by this config.

provider = "openai"
term_scope = "dreamplace_replacement"
objective_mode = "replacement"
mutation_mode = "diff"

max_iterations = 80
samples_per_iteration = 3
population_size = 100
archive_size = 20
num_islands = 5
map_elites_enabled = true
feature_bins = 8
feature_dimensions = ["complexity", "mechanism_family", "hpwl_delta_bucket", "overflow_delta_bucket", "opentimer_wns_delta_bucket"]
migration_interval = 20
migration_rate = 0.10
migration_topology = "ring"
checkpoint_interval = 10
num_top_programs = 3
num_diverse_programs = 2
seed = 42

evaluate_initial_presets = true
# Native DREAMPlace is the primary reported baseline. The runner also injects
# a native-identity custom_default control to verify that the custom-objective
# hook itself has not drifted from native DREAMPlace on the ChiPBench panel.
primary_baseline = "default"
parent_policy = "hpwl_safe_only"
structured_feedback = true
router_background = "../../prompts/router_objective_background.md"

# These gates are evaluator-side selection policy, not LLM prompt instructions.
# Completed regressions remain in negative memory; structural failures are never
# eligible as parents.
severe_regression_pct = 10.0
hpwl_gate_search_pct = 5.0
hpwl_gate_elite_pct = 3.0
per_design_hpwl_gate_search_pct = 5.0
# Allow tiny per-design overflow noise while requiring aggregate improvement.
per_design_overflow_gate_search_pct = 0.25
min_design_both_improvement_fraction = 0.0
# Search parents may be aggregate-improving near-misses; final elite promotion still requires robust per-design behavior.
require_robust_parent_gate = true
allow_near_miss_parents = true
near_miss_max_worst_hpwl_pct = 25.0
near_miss_max_worst_overflow_pct = 10.0
near_miss_parent_score_floor = 0.02
overflow_severe_regression_pct = 10.0
require_custom_default_gate = false
# Generated candidates must also outrank the fixed baseline portfolio evaluated
# in the same DREAMPlace search batch. This gate is evaluator-side feedback, not
# a prompt template.

require_baseline_portfolio_gate = true
require_baseline_portfolio_pareto = true
min_baseline_portfolio_effect_pct = 0.25
min_baseline_behavior_distance_pct = 0.5
# Evaluator-side only: prefer candidates that Pareto-improve against native DREAMPlace,
# but keep measured tradeoffs as feedback rather than hiding them from memory.
native_default_selection_policy = "prefer_pareto"
native_default_pareto_bonus = 0.02
custom_default_hpwl_gate_pct = 5.0
custom_default_overflow_gate_pct = 0.0
min_custom_default_effect_pct = 0.25

# Require generated candidates to contain a material routing-aware term so the
# run does not collapse into density-coefficient tuning.
require_nonzero_routing_term = true
# Avoid treating "wirelength + density + one tiny route correction" as a
# discovered objective. New replacement-mode LLM candidates must use at least
# two non-default observable families beyond WAWL/electric-density equivalents.
min_replacement_nonbaseline_terms = 2
min_abs_routing_coeff = 0.00000001
route_coeff_cap = 0.01
# Route observables are normalized by value, but measured gradients can still be
# much larger than wirelength/density gradients. Keep the LLM responsible for
# mechanism choice, then evaluate gradient-calibrated siblings.
route_coeff_grid = [-0.00001, -0.000003, -0.000001, -0.0000003, -0.0000001, -0.00000003, -0.00000001, 0.00000001, 0.00000003, 0.0000001, 0.0000003, 0.000001, 0.000003, 0.00001]
density_coeff_grid = [1.0]
wirelength_coeff_grid = [1.0]
max_calibrated_siblings = 10
max_generation_attempts = 4
full_rewrite_after_static_rejections = 2
escape_parent_after_static_rejections = 2
reject_baseline_mechanism_clones = true
min_baseline_mechanism_distance = 0.35
reject_repeated_negative_mechanisms = true
min_negative_mechanism_distance = 0.55

initial_presets = [
  "dreamplace_explicit_wl_density",
  "dreamplace_wl_density",
  "dreamplace_wawl_electric",
  "dreamplace_wawl_density_bell",
  "dreamplace_lse_density_bell",
  "dreamplace_density_heavy",
  "dreamplace_density_135",
  "dreamplace_routing_aware_smoke",
  "dreamplace_route_pressure_long",
  "dreamplace_pin_count_weighted_wl",
]

[search]
panel = "../shared_panels/chipbench_search_tier2_multidesign.toml"
baseline_presets = [
  "dreamplace_explicit_wl_density",
  "dreamplace_wl_density",
  "dreamplace_wawl_electric",
  "dreamplace_wawl_density_bell",
  "dreamplace_lse_density_bell",
  "dreamplace_density_heavy",
  "dreamplace_density_135",
  "dreamplace_routing_aware_smoke",
  "dreamplace_route_pressure_long",
  "dreamplace_pin_count_weighted_wl",
]

[final]
enabled = true
panel = "../shared_panels/chipbench_date_tier2.toml"
top_k = 8
baseline_presets = [
  "dreamplace_explicit_wl_density",
  "dreamplace_wl_density",
  "dreamplace_wawl_electric",
  "dreamplace_wawl_density_bell",
  "dreamplace_lse_density_bell",
  "dreamplace_density_heavy",
  "dreamplace_density_135",
  "dreamplace_routing_aware_smoke",
  "dreamplace_route_pressure_long",
  "dreamplace_pin_count_weighted_wl",
]

[tier3]
enabled = false
panel = "../shared_panels/chipbench_date_tier2.toml"
top_k = 3
baseline_objective_id = "default"
candidate_policy = "elite_or_aggregate"
baseline_presets = [
  "dreamplace_density_135",
  "dreamplace_wawl_electric",
  "dreamplace_wawl_density_bell",
]



