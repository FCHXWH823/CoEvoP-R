[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coevop-platform"
version = "0.0.1"
description = "LLM-driven routing-aware placement objective discovery platform"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "CoEvoP&R Contributors" }
]
dependencies = [
  "numpy>=1.24",
  "tomli>=2.0; python_version<'3.11'"
]

[project.scripts]
coevop = "coevop.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5"
]
baselines = [
  "optuna>=4.0"
]

[tool.setuptools.packages.find]
include = ["coevop*"]

[tool.setuptools.package-data]
coevop = ["prompts/defaults/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"
