# Paper evaluation panel for the eight ChiPBench Nangate45 designs.
seeds = [1000, 1001, 1002]
iterations = 1000
gpu = 1
timeout_seconds = 14400
log_interval = 25
timing_mode = "none"

[[designs]]
name = "bp_fe"
dreamplace_config = "../dreamplace_base/chipbench_movable/bp_fe.json"
chipbench_config = "${CHIPBENCH_ROOT}/flow/designs/nangate45/bp_fe_top/config.mk"
mode = "global"
freeze_placed_macros_for_routing = true

