# Post-route panel for the ICCAD 2015 Superblue evaluation set.
seeds = [1000, 1001, 1002]
iterations = 1000
gpu = 1
timeout_seconds = 21600
log_interval = 25
timing_mode = "none"

[[designs]]
name = "superblue1_ot_notiming"
dreamplace_config = "../dreamplace_base/iccad2015_notiming/superblue1_ot_notiming.json"
chipbench_config = "${SUPERBLUE_OPENROAD_CONFIG_ROOT}/superblue1/config.mk"
mode = "global"

