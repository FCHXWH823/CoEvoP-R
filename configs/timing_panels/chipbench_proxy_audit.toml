# Four-design timing-evidence audit used by the paper.
ot_shell = "${DREAMPLACE_ROOT}/bin/ot-shell"
timeout_seconds = 1800
iterations = 1
threads = 8
gpu = 1
legalize = false
fixed_position = true
scalarize_vector_nets = true
derive_verilog_from_def = true
min_net_coverage = 0.95
lib = [
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/NangateOpenCellLibrary_typical.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_1024x32.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_128x116.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_128x256.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_128x32.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_2048x39.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_256x16.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_256x32.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_256x34.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_256x48.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_256x95.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_256x96.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_32x32.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_32x64.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_512x64.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_64x124.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_64x15.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_64x21.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_64x32.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_64x62.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_64x64.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_64x7.lib",
  "${CHIPBENCH_ROOT}/flow/platforms/nangate45/lib/fakeram45_64x96.lib"
]

[[designs]]
name = "bp_fe"
base_config = "../dreamplace_base/chipbench_movable/bp_fe.json"
sdc = "${COEVOP_TIMING_COLLATERAL_ROOT}/bp_fe/floorplan.sdc"
top_module = "bp_fe_top"
rc_estimate = "flute_elmore_per_micron"

[[designs]]
name = "swerv_wrapper"
base_config = "../dreamplace_base/chipbench_movable/swerv_wrapper.json"
sdc = "${COEVOP_TIMING_COLLATERAL_ROOT}/swerv_wrapper/floorplan.sdc"
